# One container runs everything: Redis, authentication, user and api-gateway.
#
#   docker compose up -d --build     build and start
#   docker compose logs -f           follow the logs
#   docker compose down              stop and remove
#
# `restart: unless-stopped` brings it back automatically whenever Docker starts.
services:
  genie:
    build: .
    container_name: Genie
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped
